# backend/fly.toml
# ============================================================================
# Fly.io configuration for FastAPI backend
# ============================================================================

app = "screenshottocsv-backend"
primary_region = "iad"  # US East - change to your preferred region

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  
  # Auto-scaling: stop when idle, start on request
  auto_stop_machines = "stop"
  auto_start_machines = true
  
  # Minimum machines to keep running (0 = scale to zero)
  min_machines_running = 0
  
  # Health check configuration
  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

# Health check endpoint
[[http_service.checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "5s"
  method = "GET"
  path = "/health"

# VM resources
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

