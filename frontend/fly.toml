# frontend/fly.toml
# ============================================================================
# Fly.io configuration for Next.js frontend
# ============================================================================

app = "screenshottocsv-frontend"
primary_region = "iad"  # US East - change to your preferred region

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  
  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

