# .github/workflows/ci.yml
# ============================================================================
# CONTINUOUS INTEGRATION (CI)
# ============================================================================
# This workflow runs on:
#   - Every push to any branch
#   - Every pull request to main
#
# Purpose: Verify code quality BEFORE merging
#   - Lint: Check code style and potential errors
#   - Test: Run automated tests
#   - Build: Verify the app compiles/builds successfully
#
# This does NOT deploy anything - it only validates the code.
# ============================================================================

name: CI

on:
  # Run on every push to any branch
  push:
    branches: ['**']
  # Run on PRs targeting main
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch
# This saves CI minutes and avoids confusion
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # BACKEND CI
  # ==========================================================================
  backend-lint:
    name: Backend - Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      # Ruff is a fast Python linter - checks for errors and style issues
      - name: Install Ruff
        run: uv pip install ruff

      - name: Run Ruff linter
        run: uv run ruff check backend/

      - name: Run Ruff formatter check
        run: uv run ruff format --check backend/

  backend-test:
    name: Backend - Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      # Install pytest for testing
      - name: Install pytest
        run: uv pip install pytest pytest-asyncio httpx

      # Run tests - currently may not have tests, so allow failure
      # Remove 'continue-on-error' once you have actual tests
      - name: Run tests
        run: uv run pytest backend/ -v || echo "No tests found"
        continue-on-error: true

  backend-build:
    name: Backend - Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Verify the Dockerfile builds successfully
      # We don't push the image - just verify it builds
      - name: Build Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t screenshottocsv-backend:ci-test \
            .

  # ==========================================================================
  # FRONTEND CI
  # ==========================================================================
  frontend-lint:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ESLint checks for code quality issues
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  frontend-typecheck:
    name: Frontend - Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # TypeScript type checking
      - name: Run TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Build the Next.js app to verify it compiles
      # Use a dummy backend URL for CI - actual URL is set during CD
      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
        run: npm run build

  frontend-docker:
    name: Frontend - Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Verify the Dockerfile builds successfully
      - name: Build Docker image
        working-directory: frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_BACKEND_URL=http://localhost:8000 \
            -t screenshottocsv-frontend:ci-test \
            .

  # ==========================================================================
  # CI STATUS CHECK
  # ==========================================================================
  # This job only runs if all other jobs pass
  # GitHub branch protection can require this job to pass before merging
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-test
      - backend-build
      - frontend-lint
      - frontend-typecheck
      - frontend-build
      - frontend-docker
    if: always()
    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.backend-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-build.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-typecheck.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-build.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-docker.result }}" == "failure" ]]; then
            echo "❌ CI failed - one or more required checks did not pass"
            exit 1
          fi
          echo "✅ CI passed - all required checks passed"

