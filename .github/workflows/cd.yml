# .github/workflows/cd.yml
# ============================================================================
# CONTINUOUS DEPLOYMENT (CD)
# ============================================================================
# This workflow runs ONLY when:
#   - Code is pushed/merged to the main branch
#
# Purpose: Deploy validated code to production
#   - Build production Docker images
#   - Deploy to Fly.io
#   - Verify deployment health
#
# Prerequisites:
#   - CI must have passed (enforced by branch protection)
#   - FLY_API_TOKEN secret must be configured
# ============================================================================

name: CD

on:
  push:
    branches: [main]

# Only one deployment at a time to avoid conflicts
concurrency:
  group: production-deployment
  cancel-in-progress: false  # Don't cancel ongoing deployments

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  # ==========================================================================
  # DEPLOY BACKEND
  # ==========================================================================
  deploy-backend:
    name: Deploy Backend to Fly.io
    runs-on: ubuntu-latest
    outputs:
      backend_url: ${{ steps.get-url.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the Fly CLI
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploy backend to Fly.io
      # The --remote-only flag builds the image on Fly's servers
      - name: Deploy Backend
        run: |
          flyctl deploy \
            --config backend/fly.toml \
            --dockerfile backend/Dockerfile \
            --remote-only \
            --wait-timeout 300

      # Get the backend URL for frontend deployment
      - name: Get Backend URL
        id: get-url
        run: |
          BACKEND_HOSTNAME=$(flyctl status --config backend/fly.toml --json | jq -r '.Hostname')
          echo "url=https://$BACKEND_HOSTNAME" >> $GITHUB_OUTPUT
          echo "Backend URL: https://$BACKEND_HOSTNAME"

      # Verify the deployment is healthy
      - name: Verify Backend Health
        run: |
          echo "Waiting for backend to be ready..."
          sleep 10
          
          BACKEND_URL="${{ steps.get-url.outputs.url }}"
          echo "Checking health at: $BACKEND_URL/health"
          
          # Health check with retries
          for i in {1..5}; do
            if curl -sf "$BACKEND_URL/health" > /dev/null; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          
          echo "❌ Backend health check failed"
          exit 1

  # ==========================================================================
  # DEPLOY FRONTEND
  # ==========================================================================
  deploy-frontend:
    name: Deploy Frontend to Fly.io
    runs-on: ubuntu-latest
    # Frontend depends on backend being deployed first
    # This ensures the backend URL is available
    needs: [deploy-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploy frontend to Fly.io with the backend URL
      - name: Deploy Frontend
        working-directory: frontend
        run: |
          echo "Deploying frontend with backend URL: ${{ needs.deploy-backend.outputs.backend_url }}"
          flyctl deploy \
            --remote-only \
            --build-arg NEXT_PUBLIC_BACKEND_URL=${{ needs.deploy-backend.outputs.backend_url }} \
            --wait-timeout 300

      # Get frontend URL
      - name: Get Frontend URL
        id: get-url
        working-directory: frontend
        run: |
          FRONTEND_HOSTNAME=$(flyctl status --json | jq -r '.Hostname')
          echo "url=https://$FRONTEND_HOSTNAME" >> $GITHUB_OUTPUT
          echo "Frontend URL: https://$FRONTEND_HOSTNAME"

      # Verify frontend is accessible
      - name: Verify Frontend Health
        run: |
          echo "Waiting for frontend to be ready..."
          sleep 10
          
          FRONTEND_URL="${{ steps.get-url.outputs.url }}"
          echo "Checking frontend at: $FRONTEND_URL"
          
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" || echo "000")
            if [[ "$HTTP_CODE" == "200" ]] || [[ "$HTTP_CODE" == "304" ]]; then
              echo "✅ Frontend is healthy! (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done
          
          echo "❌ Frontend health check failed"
          exit 1

  # ==========================================================================
  # DEPLOYMENT SUMMARY
  # ==========================================================================
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Print Deployment Summary
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "============================================"
          echo "           DEPLOYMENT SUMMARY"
          echo "============================================"
          echo ""
          
          if [[ "${{ needs.deploy-backend.result }}" == "success" ]]; then
            BACKEND_URL=$(flyctl status --config backend/fly.toml --json | jq -r '.Hostname' 2>/dev/null || echo "unknown")
            echo "✅ Backend:  https://$BACKEND_URL"
            echo "   Health:   https://$BACKEND_URL/health"
          else
            echo "❌ Backend:  Deployment failed"
          fi
          
          echo ""
          
          if [[ "${{ needs.deploy-frontend.result }}" == "success" ]]; then
            FRONTEND_URL=$(flyctl status --config frontend/fly.toml --json | jq -r '.Hostname' 2>/dev/null || echo "unknown")
            echo "✅ Frontend: https://$FRONTEND_URL"
          else
            echo "❌ Frontend: Deployment failed"
          fi
          
          echo ""
          echo "============================================"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "============================================"

